<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#e7eaf0;background:#111318;line-height:1.6}body{max-width:880px;margin:auto;padding:28px}h1{font-size:26px;margin:0 0 6px}p,small{color:#949daa}button,input{font:inherit}button{border:0;border-radius:8px;background:#303b51;color:white;padding:9px 16px;cursor:pointer}button:disabled{opacity:.5}header,.toolbar,.group{display:flex;align-items:center;justify-content:space-between;gap:16px}.toolbar{margin:24px 0}input[type=search],input[type=text]{background:#1c212b;border:1px solid #303746;border-radius:8px;color:inherit;padding:10px;width:100%;box-sizing:border-box}label.group{padding:14px 0;border-bottom:1px solid #262c36;justify-content:flex-start}input[type=checkbox]{accent-color:#90b3ff;width:17px;height:17px}.group strong,.group small{display:block}.group input{flex-shrink:0}.settings{display:grid;gap:16px;margin:28px 0}#status{font-size:13px;color:#9eb9eb}#feedback{min-height:26px;white-space:pre-wrap}.save{background:#537bc6}.setting{display:flex;align-items:center;gap:9px}a{color:#a8c3fa}@media(max-width:550px){body{padding:18px}header{align-items:flex-start;flex-direction:column}}
</style></head><body><header><div><h1>AE Orbit 通知渠道</h1><p>在这里选择通知群，网页自动同步。下单时再选择 @ 接收人。</p></div><span id="status">读取连接状态…</span></header><p id="endpoint"></p><div class="toolbar"><input id="search" type="search" placeholder="搜索群名或群号" aria-label="搜索群"><button id="refresh">刷新群列表</button></div><div id="groups"></div><div class="settings"><label class="setting"><input id="private" type="checkbox">允许对已选群的接收人发送私聊副本</label><label>告警 @ 接收人（留空则普通播报）<input id="alarm" type="text" inputmode="numeric" maxlength="15" placeholder="QQ 号"></label><p>停用群后，该群的待发通知和正在跟踪的提醒将停用。真实发送仍需在 AE Orbit 开启。</p></div><button class="save" id="save">保存并同步</button><p id="feedback" role="status"></p><script>
let data=null,chosen=new Set(),busy=false;const $=s=>document.querySelector(s),escapeText=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const q=$('#search').value.toLowerCase();$('#groups').innerHTML=(data?.groups||[]).filter(g=>(g.name+' '+g.group_id).toLowerCase().includes(q)).map(g=>`<label class="group"><input type="checkbox" value="${escapeText(g.group_id)}" ${chosen.has(g.group_id)?'checked':''}><span><strong>${escapeText(g.name||g.group_id)}</strong><small>${escapeText(g.group_id)}</small></span></label>`).join('')||'<p>尚无可选群，请刷新机器人群列表。</p>';$('#status').textContent=data?.status||'等待连接';$('#endpoint').textContent='连接地址：'+(data?.endpoint||'');}
function accept(v){data=v;chosen=new Set(v.policy.groups);$('#private').checked=v.policy.allow_private;$('#alarm').value=v.policy.alarm_recipient;render();}
async function run(fn){if(busy)return;busy=true;$('#save').disabled=$('#refresh').disabled=true;$('#feedback').textContent='正在处理…';try{await fn()}catch(e){$('#feedback').textContent=e.message||String(e)}finally{busy=false;$('#save').disabled=$('#refresh').disabled=false}}
$('#search').oninput=render;$('#groups').onchange=e=>{if(e.target.type==='checkbox')e.target.checked?chosen.add(e.target.value):chosen.delete(e.target.value)};
$('#refresh').onclick=()=>run(async()=>{accept(await window.maibot.action('refresh',{}));$('#feedback').textContent='机器人群列表已刷新。';});
$('#save').onclick=()=>run(async()=>{accept(await window.maibot.action('save',{groups:[...chosen],allow_private:$('#private').checked,alarm_recipient:$('#alarm').value.trim()}));$('#feedback').textContent='通知渠道已保存并同步到 AE Orbit。';});
async function start(){try{accept(await window.maibot.query('status',{}));$('#feedback').textContent='仅勾选的群可以收到 AE Orbit 通知。';}catch(e){$('#feedback').textContent=e.message||String(e)}}
start();
</script></body></html>
