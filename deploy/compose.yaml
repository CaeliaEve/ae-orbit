name: ae-orbit
services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: aeorbit
      POSTGRES_DB: aeorbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env with scripts/init_env.py}
    volumes:
      # PostgreSQL 18 images keep versioned PGDATA below this directory.
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeorbit -d aeorbit"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    ports:
      - "127.0.0.1:${AE_HTTP_PORT:-8080}:8080"
    environment:
      AE_LISTEN: 0.0.0.0:8080
      AE_PUBLIC_URL: ${AE_PUBLIC_URL:-http://127.0.0.1:8080}
      AE_DATABASE_URL: "postgres://aeorbit:${POSTGRES_PASSWORD}@db:5432/aeorbit?sslmode=disable"
      AE_ADMIN_TOKEN: ${AE_ADMIN_TOKEN:?Generate .env with scripts/init_env.py}
      GOMEMLIMIT: ${GOMEMLIMIT:-256MiB}
      AE_DB_CONNECTIONS: ${AE_DB_CONNECTIONS:-16}
      AE_BATCH_BYTES: ${AE_BATCH_BYTES:-32768}
      AE_BATCH_ITEMS: ${AE_BATCH_ITEMS:-128}
      AE_RESPONSE_BYTES: ${AE_RESPONSE_BYTES:-32768}
      AE_GROUP_PLANNING: ${AE_GROUP_PLANNING:-1}
      AE_SCAN_ITEMS: ${AE_SCAN_ITEMS:-32}
      AE_ACTIVE_WINDOW: ${AE_ACTIVE_WINDOW:-4}
      AE_MAX_QUEUED: ${AE_MAX_QUEUED:-256}
      AE_MAX_CONCURRENT: ${AE_MAX_CONCURRENT:-64}
      AE_MAX_STREAMS: ${AE_MAX_STREAMS:-32}
      AE_OFFLINE_SECONDS: ${AE_OFFLINE_SECONDS:-90}
      AE_RECHECK_SECONDS: ${AE_RECHECK_SECONDS:-300}
      AE_POLL_MILLIS: ${AE_POLL_MILLIS:-1000}
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${AE_CONTAINER_MEMORY:-512m}
    stop_grace_period: 15s
volumes:
  pg_data:
