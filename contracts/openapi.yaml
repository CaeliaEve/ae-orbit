openapi: 3.1.0
info:
  title: AE Orbit
  version: 1.0.0
  description: |
    Go service and OC bridge protocol; no frontend is included.
    Quantities, item IDs, revisions and sequence numbers are exact decimal strings.
    Network/member/order/session/attempt IDs are opaque strings.
    Deployment is one service instance with PostgreSQL.
servers:
  - url: http://127.0.0.1:8080
security:
  - memberBearer: []
  - browserCookie: []
tags:
  - {name: Health}
  - {name: Members}
  - {name: Networks}
  - {name: Inventory}
  - {name: Orders}
  - {name: Bridge}
paths:
  /oc/{path}:
    get:
      operationId: downloadOCFile
      tags: [Bridge]
      security: []
      description: |
        Download an embedded OC Lua module or installer. The path may contain slashes.
        Allowed roots are lib/aeorbit/*.lua, bin/ae-orbit.lua, config.example.lua and install.lua.
        Tests, directories, live configuration and journals are not served.
      parameters:
        - {name: path, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Bundled Lua source, content: {text/plain: {schema: {type: string}}}}
        '404': {description: File is not included in the bundle}
        default: {$ref: '#/components/responses/Error'}
  /healthz:
    get:
      operationId: health
      tags: [Health]
      security: []
      responses:
        '200': {description: Process is running, content: {application/json: {schema: {$ref: '#/components/schemas/HealthStatus'}}}}
        default: {$ref: '#/components/responses/Error'}
  /readyz:
    get:
      operationId: readiness
      tags: [Health]
      security: []
      responses:
        '200': {description: Database responds, content: {application/json: {schema: {$ref: '#/components/schemas/HealthStatus'}}}}
        '503': {description: Database unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/HealthStatus'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/session:
    post:
      operationId: createSession
      tags: [Members]
      security: []
      description: |
        Exchange a member/admin token for an HttpOnly SameSite=Strict cookie and a CSRF token.
        An Origin header, when supplied, must equal AE_PUBLIC_URL. Session lifetime is 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties: {token: {$ref: '#/components/schemas/Token'}}
      responses:
        '201':
          description: Browser session created; the ac_session cookie is scoped to /api/.
          headers:
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [member, csrf, expires_at]
                properties:
                  member: {$ref: '#/components/schemas/Member'}
                  csrf: {type: string}
                  expires_at: {type: string, format: date-time}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteSession
      tags: [Members]
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      responses:
        '204': {description: Session deleted and cookie cleared}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me:
    get:
      operationId: currentMember
      tags: [Members]
      responses:
        '200': {description: Authenticated member, content: {application/json: {schema: {$ref: '#/components/schemas/Member'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/members:
    get:
      operationId: listMembers
      tags: [Members]
      description: Admin only. Returns up to 1000 active members.
      responses:
        '200': {description: Active members, content: {application/json: {schema: {type: array, maxItems: 1000, items: {$ref: '#/components/schemas/Member'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createMember
      tags: [Members]
      description: Admin only. The plaintext token is returned once. New members are never admins.
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 128}
                grants: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/Grant'}}
      responses:
        '201':
          description: Member and token
          content:
            application/json:
              schema:
                type: object
                required: [member, token]
                properties: {member: {$ref: '#/components/schemas/Member'}, token: {$ref: '#/components/schemas/Token'}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/members/{member}:
    parameters: [{$ref: '#/components/parameters/MemberID'}]
    delete:
      operationId: revokeMember
      tags: [Members]
      description: Admin only. Revokes the member token and all their browser sessions. Cannot revoke admin.
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      responses:
        '204': {description: Member revoked}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/members/{member}/networks/{network}:
    parameters: [{$ref: '#/components/parameters/MemberID'}, {$ref: '#/components/parameters/NetworkID'}]
    put:
      operationId: grantNetwork
      tags: [Members]
      description: Admin only. Grant viewing and optionally crafting access to a network.
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [can_craft]
              properties: {can_craft: {type: boolean}}
      responses:
        '204': {description: Access updated}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: revokeNetworkGrant
      tags: [Members]
      description: Admin only. Removes access; existing game jobs are unaffected.
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      responses:
        '204': {description: Access removed}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/networks:
    get:
      operationId: listNetworks
      tags: [Networks]
      description: Returns up to 1000 accessible networks.
      responses:
        '200': {description: Accessible networks, content: {application/json: {schema: {type: array, maxItems: 1000, items: {$ref: '#/components/schemas/Network'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createNetwork
      tags: [Networks]
      description: Admin only. Networks on the same Minecraft server must share server_group.
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, server_group, source]
              properties:
                name: {type: string, minLength: 1, maxLength: 128}
                server_group: {type: string, minLength: 1, maxLength: 128}
                source: {type: string, enum: [oc, simulator]}
      responses:
        '201':
          description: Network and one-time device credential
          content:
            application/json:
              schema:
                type: object
                required: [network, device_token]
                properties: {network: {$ref: '#/components/schemas/Network'}, device_token: {$ref: '#/components/schemas/Token'}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/networks/{network}:
    parameters: [{$ref: '#/components/parameters/NetworkID'}]
    get:
      operationId: getNetwork
      tags: [Networks]
      responses:
        '200': {description: Network freshness and capabilities, content: {application/json: {schema: {$ref: '#/components/schemas/Network'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/networks/{network}/device-token:
    parameters: [{$ref: '#/components/parameters/NetworkID'}]
    post:
      operationId: rotateDeviceToken
      tags: [Networks]
      description: |
        Admin only. Immediately invalidates the old token and bridge session.
        Retains inventory, marks possible executions needs_review, and clears CPU snapshots.
        This operation is not idempotent; if the response is lost, rotate again and install the latest token.
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses:
        '200':
          description: Replacement credential, returned once
          content:
            application/json:
              schema:
                type: object
                required: [device_token]
                properties: {device_token: {$ref: '#/components/schemas/Token'}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/networks/{network}/devices:
    parameters: [{$ref: '#/components/parameters/NetworkID'}]
    get:
      operationId: listDevices
      tags: [Networks]
      description: Requires network viewing access. Returns device status without credentials or token hashes.
      responses:
        '200': {description: Registered devices, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DeviceView'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createDevice
      tags: [Networks]
      description: Admin only. Creates a quantity_worker; at most eight unrevoked devices per network. The independent token is returned once.
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties: {name: {type: string, minLength: 1, maxLength: 128}}
      responses:
        '201':
          description: New reader and one-time credential
          content:
            application/json:
              schema:
                type: object
                required: [device, device_token]
                properties: {device: {$ref: '#/components/schemas/DeviceView'}, device_token: {$ref: '#/components/schemas/Token'}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/networks/{network}/devices/{device}/token:
    parameters: [{$ref: '#/components/parameters/NetworkID'}, {$ref: '#/components/parameters/DeviceID'}]
    post:
      operationId: rotateIndividualDeviceToken
      tags: [Networks]
      description: Admin only. Invalidates only this device credential, session and outstanding read assignments. Requires a new boot.
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses:
        '200':
          description: Replacement credential, returned once
          content:
            application/json:
              schema:
                type: object
                required: [device_token]
                properties: {device_token: {$ref: '#/components/schemas/Token'}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/networks/{network}/devices/{device}:
    parameters: [{$ref: '#/components/parameters/NetworkID'}, {$ref: '#/components/parameters/DeviceID'}]
    delete:
      operationId: revokeDevice
      tags: [Networks]
      description: Admin only. Revokes a quantity_worker without deleting inventory or historical evidence. Primary revocation is forbidden.
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      responses:
        '204': {description: Reader revoked}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/networks/{network}/cooperation:
    parameters: [{$ref: '#/components/parameters/NetworkID'}]
    post:
      operationId: enableCooperation
      tags: [Networks]
      description: |
        Admin only. Idempotently enables cooperative mode. Returns 409 while any order is assigned,
        computing or running. Retires sessions and read grants, clears primary CPU/health/scan
        views, and preserves inventory, evidence times, queued/needs_review orders and logical refreshes.
        Both devices require a new protocol-2 boot. There is no hot downgrade endpoint.
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses:
        '200': {description: Current network status, content: {application/json: {schema: {$ref: '#/components/schemas/Network'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/networks/{network}/items:
    parameters: [{$ref: '#/components/parameters/NetworkID'}]
    get:
      operationId: listItems
      tags: [Inventory]
      description: |
        Keyset pagination bound to network and query. The default strict consistency rejects
        any changed inventory revision with 409 view_changed. Opt-in live consistency supports
        only name sorting and tolerates quantity changes. It still rejects catalog/label/session
        changes, and recipe-flag changes when craftable is filtered. These checks are conservatively
        network-wide. Each page carries current cached values and its current inventory revision;
        live pages are not a frozen multi-page snapshot. A service restart invalidates cursor signatures.
        Metadata for display excludes raw NBT; orders use item_id.
        Short queries (under 3 Unicode characters) use prefix matching; longer queries use substring matching.
        Supports negotiated gzip for successful pages. Normally only bodies of at least 1024 bytes
        that shrink are compressed; explicitly refusing identity can require gzip for smaller bodies.
        Returns 406 if neither gzip nor identity is acceptable. OC and SSE encodings are unchanged.
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 128}}
        - {name: sort, in: query, schema: {type: string, enum: [name, quantity], default: name}}
        - {name: consistency, in: query, schema: {type: string, enum: [strict, live], default: strict}, description: Live consistency requires name sorting.}
        - {name: craftable, in: query, schema: {type: boolean}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 4096}}
      responses:
        '200':
          description: One inventory page; decimal strings remain exact after decompression.
          headers:
            Content-Encoding: {description: Present when gzip is selected., schema: {type: string, enum: [gzip]}}
            Vary: {schema: {type: string, example: Accept-Encoding}}
            Server-Timing: {description: Server time to headers and database phase timings in milliseconds; phases can overlap., schema: {type: string}}
          content: {application/json: {schema: {$ref: '#/components/schemas/ItemPage'}}}
        '406': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/networks/{network}/items/lookup:
    parameters: [{$ref: '#/components/parameters/NetworkID'}]
    get:
      operationId: lookupInventoryItems
      tags: [Inventory]
      description: |
        Read up to 200 requested IDs from cached inventory in one short consistent transaction.
        Does not request new OC observations, schedule work or execute crafting. Duplicates are
        merged in first-occurrence order. Items and missing_ids each follow request order.
        Unknown IDs and IDs from other networks appear only in missing_ids, never as invented zero stock.
        Values, independent observation times and current_session have the same meaning as inventory pages.
        Accepts exactly one ids parameter, at most 3999 decoded bytes, with the 200-entry bound checked
        before deduplication. Supports the same negotiated gzip and HEAD behavior as inventory pages.
        Display metadata excludes raw NBT. Does not freeze membership or ordering of a previous page.
        Optional refreshes reports the latest retained one-shot request for requested IDs without
        creating work. An expired request never changes its cached quantity into zero.
      parameters:
        - name: ids
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 200
            items: {$ref: '#/components/schemas/PositiveQuantity'}
      responses:
        '200':
          description: Cached items and explicit missing IDs; all IDs and quantities are exact decimal strings.
          headers:
            Content-Encoding: {schema: {type: string, enum: [gzip]}}
            Vary: {schema: {type: string, example: Accept-Encoding}}
            Server-Timing: {schema: {type: string}}
          content: {application/json: {schema: {$ref: '#/components/schemas/ItemLookup'}}}
        '406': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/networks/{network}/items/refresh:
    parameters: [{$ref: '#/components/parameters/NetworkID'}]
    post:
      operationId: refreshInventoryItems
      tags: [Inventory]
      description: |
        Request asynchronous quantity-only observations for 1-32 item IDs, checked before deduplication.
        Viewing access suffices; no crafting is performed. Returns cached values immediately, with
        latest per-item refresh status. Aliases share a canonical request. Pending duplicates reuse
        its generation and 60-second deadline; a request after confirmation or expiry starts a new generation.
        After alias resolution, every existing requested cached resource must have kind=item and exact=true;
        otherwise the entire batch returns 400 invalid_request without enqueueing any work.
        Unknown and cross-network IDs remain missing_ids and do not cause this rejection.
        Limits are 128 pending and 256 retained statuses per network. Old terminal statuses may be evicted.
        Requires current device inventory and quantity_refresh capabilities; otherwise returns 409.
        Offline supported devices may queue work, which expires without changing cached stock.
        Successful fresh matching receipts generate an inventory event even if quantity is unchanged.
        Expiry itself does not generate a timed event; read status at the deadline. This is not a latency SLA.
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ids]
              properties:
                ids: {type: array, minItems: 1, maxItems: 32, items: {$ref: '#/components/schemas/PositiveQuantity'}}
      responses:
        '202':
          description: Current cached inventory, explicit missing IDs, and retained refresh generations.
          content: {application/json: {schema: {$ref: '#/components/schemas/ItemLookup'}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/networks/{network}/inventory-stats:
    parameters: [{$ref: '#/components/parameters/NetworkID'}]
    get:
      operationId: inventoryStats
      tags: [Inventory]
      description: Exact database aggregates. This scans network inventory; avoid requesting on every item event.
      responses:
        '200':
          description: Decimal counts; total_quantity may exceed int64
          content:
            application/json:
              schema:
                type: object
                required: [entries, craftable, total_quantity]
                properties:
                  entries: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
                  craftable: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
                  total_quantity: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/networks/{network}/cpus:
    parameters: [{$ref: '#/components/parameters/NetworkID'}]
    get:
      operationId: listCPUs
      tags: [Inventory]
      responses:
        '200': {description: Last CPU snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/CPUView'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/networks/{network}/orders:
    parameters: [{$ref: '#/components/parameters/NetworkID'}]
    get:
      operationId: listOrders
      tags: [Orders]
      description: Most recent orders, newest first; no unbounded history export.
      parameters:
        - {name: state, in: query, schema: {$ref: '#/components/schemas/OrderState'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        '200': {description: Recent orders, content: {application/json: {schema: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Order'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createOrder
      tags: [Orders]
      description: |
        Requires crafting permission. Crafts an ADDITIONAL quantity and leaves the output in AE.
        Reuse the same member/network/idempotency_key and parameters for retries.
        A parameter mismatch returns 409. Default queue TTL is 3600 seconds.
        Idempotency remains available while the order is retained (terminal history: 30 days).
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OrderInput'}}}
      responses:
        '201': {description: New or existing matching order, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/networks/{network}/orders/{order}:
    parameters: [{$ref: '#/components/parameters/NetworkID'}, {$ref: '#/components/parameters/OrderID'}]
    get:
      operationId: getOrder
      tags: [Orders]
      responses:
        '200': {description: Order state, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/networks/{network}/orders/{order}/events:
    parameters: [{$ref: '#/components/parameters/NetworkID'}, {$ref: '#/components/parameters/OrderID'}]
    get:
      operationId: getOrderHistory
      tags: [Orders]
      description: Last 100 state transitions, newest first. This endpoint returns JSON, not SSE.
      responses:
        '200': {description: Audit events, content: {application/json: {schema: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/OrderEvent'}}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/networks/{network}/orders/{order}/cancel:
    parameters: [{$ref: '#/components/parameters/NetworkID'}, {$ref: '#/components/parameters/OrderID'}]
    post:
      operationId: cancelQueuedOrder
      tags: [Orders]
      description: Requires crafting permission. Only queued orders can be canceled; a repeated cancel is idempotent.
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      responses:
        '200': {description: Canceled order, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/networks/{network}/orders/{order}/resolve:
    parameters: [{$ref: '#/components/parameters/NetworkID'}, {$ref: '#/components/parameters/OrderID'}]
    post:
      operationId: resolveUncertainOrder
      tags: [Orders]
      description: Admin only. Resolve needs_review after checking AE. Does not submit or cancel a game operation.
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state, reason]
              properties:
                state: {type: string, enum: [done, failed, canceled]}
                reason: {type: string, minLength: 1, maxLength: 1024}
      responses:
        '200': {description: Resolved order, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/networks/{network}/events:
    parameters: [{$ref: '#/components/parameters/NetworkID'}]
    get:
      operationId: subscribeNetwork
      tags: [Networks]
      description: |
        SSE invalidation metadata only. Initial connection sends reset.
        Resume with Last-Event-ID; missing history, a future ID, or more than 128 replay events sends reset.
        change data is NetworkEvent; reset data is {network_id,reason:"refresh_view"}.
        Heartbeat comments are sent every ~15s. Permission is rechecked while connected.
        In-process commits wake subscribers immediately; durable events remain the replay source.
        Each subscriber holds at most one pending wakeup. A 15s fallback discovers external writes
        and rechecks permissions. Session expiry and cancellation close the stream independently.
        SSE is not compressed. HEAD returns headers without opening a persistent subscription.
        CPU invalidations compare visible state as a multiset, preserving duplicate CPUs.
        Snapshot-local IDs, list order and observation time alone do not produce a CPU event.
        First snapshots, session changes, truncation changes and visible state changes do.
      parameters:
        - {name: Last-Event-ID, in: header, schema: {$ref: '#/components/schemas/Quantity'}}
      responses:
        '200': {description: SSE stream (reset/change events), content: {text/event-stream: {schema: {type: string}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/admin/metrics:
    get:
      operationId: metrics
      tags: [Health]
      description: |
        Admin only. Bounded runtime, HTTP, database and event diagnostics; not a public Prometheus endpoint.
        HTTP labels are registered route templates; unmatched URLs share one label. SSE lifetimes are excluded.
        Database acquisition includes connection establishment and canceled waits. lock_query measures entire
        explicit locking statements, not pure lock wait. transaction and commit cover store write transactions.
        Timing phases can overlap. Counters reset on restart. No SQL, credentials or resource IDs are retained.
      responses:
        '200':
          description: Runtime counters
          content:
            application/json:
              schema:
                type: object
                properties:
                  uptime_seconds: {type: integer}
                  requests: {type: string}
                  active_requests: {type: integer}
                  active_streams: {type: integer}
                  goroutines: {type: integer}
                  heap_bytes: {type: string}
                  gc_cycles: {type: integer}
                  database_connections: {type: integer}
                  database_acquired: {type: integer}
                  database_acquire_wait_ms: {type: integer}
                  database_acquires: {$ref: '#/components/schemas/Counter'}
                  database_empty_acquires: {$ref: '#/components/schemas/Counter'}
                  database_canceled_acquires: {$ref: '#/components/schemas/Counter'}
                  http: {type: array, items: {$ref: '#/components/schemas/HTTPPerformance'}}
                  database:
                    type: object
                    properties:
                      query: {$ref: '#/components/schemas/DurationMetric'}
                      acquire: {$ref: '#/components/schemas/DurationMetric'}
                      batch: {$ref: '#/components/schemas/DurationMetric'}
                      lock_query: {$ref: '#/components/schemas/DurationMetric'}
                      transaction: {$ref: '#/components/schemas/DurationMetric'}
                      commit: {$ref: '#/components/schemas/DurationMetric'}
                  notifications:
                    type: object
                    properties:
                      networks: {type: integer, minimum: 0}
                      subscribers: {type: integer, minimum: 0}
                      published: {$ref: '#/components/schemas/Counter'}
                      coalesced: {$ref: '#/components/schemas/Counter'}
                  events:
                    type: object
                    properties:
                      reads: {$ref: '#/components/schemas/Counter'}
                      wakeups: {$ref: '#/components/schemas/Counter'}
                      fallback_checks: {$ref: '#/components/schemas/Counter'}
                      delivered: {$ref: '#/components/schemas/Counter'}
                      resets: {$ref: '#/components/schemas/Counter'}
                      read_duration: {$ref: '#/components/schemas/DurationMetric'}
                      event_age:
                        description: Event created_at to server flush, including historical replay and pre-commit time; not game-to-browser latency.
                        allOf: [{$ref: '#/components/schemas/DurationMetric'}]
        default: {$ref: '#/components/responses/Error'}
  /bridge/v1/boot-id:
    post:
      operationId: deviceBootID
      tags: [Bridge]
      security: [{deviceBearer: []}]
      description: Obtain a fresh random boot nonce before starting a new bridge process.
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses:
        '200':
          description: Random boot identity
          content:
            application/json:
              schema:
                type: object
                required: [boot_id]
                properties: {boot_id: {type: string, minLength: 32, maxLength: 128}}
        default: {$ref: '#/components/responses/Error'}
  /bridge/v1/hello:
    post:
      operationId: deviceHello
      tags: [Bridge]
      security: [{deviceBearer: []}]
      description: |
        Same live boot_id returns the same session; retired boot IDs are rejected.
        New boot retires prior tracking and marks possible side effects needs_review.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Hello'}}}}
      responses:
        '200': {description: Negotiated session and bounds, content: {application/json: {schema: {$ref: '#/components/schemas/Welcome'}}}}
        default: {$ref: '#/components/responses/Error'}
  /bridge/v1/inventory:
    post:
      operationId: uploadInventory
      tags: [Bridge]
      security: [{deviceBearer: []}]
      description: |
        Absolute observed quantities; never event deltas. One unacknowledged batch per session.
        Retry the same payload at the same sequence. Acknowledgement and inventory commit atomically.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryBatch'}}}}
      responses:
        '200': {description: Committed checkpoint and short-ID bindings, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryAck'}}}}
        default: {$ref: '#/components/responses/Error'}
  /bridge/v1/poll:
    post:
      operationId: devicePoll
      tags: [Bridge]
      security: [{deviceBearer: []}]
      description: |
        Independent control sequence, job reports, optional CPU snapshot and health.
        Returns bounded commands, exact reread hints and shared server-group acquisition credits.
        On replay, commands that have become terminal/uncertain may be removed from the response.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Poll'}}}}
      responses:
        '200': {description: Control acknowledgement, content: {application/json: {schema: {$ref: '#/components/schemas/PollAck'}}}}
        default: {$ref: '#/components/responses/Error'}
  /bridge/v2/boot-id:
    post:
      operationId: deviceBootIDV2
      tags: [Bridge]
      security: [{deviceBearer: []}]
      description: Cooperative devices only. Single-mode credentials return 409; workers cannot use v1 endpoints.
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses:
        '200':
          description: Random boot identity
          content:
            application/json:
              schema:
                type: object
                required: [boot_id]
                properties: {boot_id: {type: string, pattern: '^[0-9a-f]{32}$'}}
        default: {$ref: '#/components/responses/Error'}
  /bridge/v2/hello:
    post:
      operationId: deviceHelloV2
      tags: [Bridge]
      security: [{deviceBearer: []}]
      description: Independent per-device session; role and device ID come only from credentials. Retired boots cannot resume.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/HelloV2'}}}}
      responses:
        '200': {description: Cooperative session and bounds, content: {application/json: {schema: {$ref: '#/components/schemas/WelcomeV2'}}}}
        default: {$ref: '#/components/responses/Error'}
  /bridge/v2/poll:
    post:
      operationId: devicePollV2
      tags: [Bridge]
      security: [{deviceBearer: []}]
      description: |
        Independent sequence and ACK per device. Both read capacities must be positive to dispatch.
        Workers cannot submit CPU snapshots, order reports or discovery hints. No legacy read lanes.
        Same server_group shares acquisition credits with v1 networks. Replays cannot mint grants or
        renew TTL; expired and superseded assignments are filtered. Deduct HTTP round-trip duration
        from grant TTL and do not reset remaining credits on repeated grant IDs.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PollV2'}}}}
      responses:
        '200': {description: Device control ACK and bounded read assignments, content: {application/json: {schema: {$ref: '#/components/schemas/PollAckV2'}}}}
        default: {$ref: '#/components/responses/Error'}
  /bridge/v2/inventory:
    post:
      operationId: uploadInventoryV2
      tags: [Bridge]
      security: [{deviceBearer: []}]
      description: |
        Inventory and transport ACK commit atomically. Immutable retries preserve sequence/body.
        Worker updates require a known canonical ID, quantity-only assignment and craftable:null;
        workers cannot define items or mark scans complete. Quantity_recipe requires primary and
        boolean craftable. Expired or superseded but structurally valid receipts may be transport
        ACKed without changing inventory, evidence times or logical request state.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryBatchV2'}}}}
      responses:
        '200': {description: Committed device checkpoint, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryAck'}}}}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    memberBearer: {type: http, scheme: bearer, description: 'Admin/member token, never an OC device token'}
    deviceBearer: {type: http, scheme: bearer, description: 'Independent device token, never a member token'}
    browserCookie: {type: apiKey, in: cookie, name: ac_session, description: Mutations also require matching Origin and X-CSRF-Token}
  parameters:
    NetworkID: {name: network, in: path, required: true, schema: {$ref: '#/components/schemas/ID'}}
    DeviceID: {name: device, in: path, required: true, schema: {$ref: '#/components/schemas/ID'}}
    MemberID: {name: member, in: path, required: true, schema: {$ref: '#/components/schemas/ID'}}
    OrderID: {name: order, in: path, required: true, schema: {$ref: '#/components/schemas/ID'}}
    CSRF: {name: X-CSRF-Token, in: header, description: Required for cookie-authenticated mutations, schema: {type: string}}
    Origin: {name: Origin, in: header, description: Must equal AE_PUBLIC_URL for cookie-authenticated mutations, schema: {type: string}}
  requestBodies:
    Empty:
      required: true
      content: {application/json: {schema: {type: object, additionalProperties: false}}}
  responses:
    Error:
      description: |
        Application error. 400 invalid_request/invalid_reference; 401 unauthorized; 403 forbidden;
        404 not_found; 409 conflict/sequence_conflict/stale_session/view_changed/capability_unavailable;
        413 body_too_large; 415 json_required; 429 capacity_exceeded; 503 timeout/busy; 500 internal_error.
        Unknown routes and unsupported methods may use standard HTTP text errors.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties: {code: {type: string}, message: {type: string}}
  schemas:
    Counter:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
    DurationMetric:
      type: object
      description: Fixed cumulative buckets in milliseconds; samples above 15000ms still count toward count, total_ms and max_ms. Not exact percentiles.
      required: [count, errors, total_ms, max_ms, buckets]
      properties:
        count: {$ref: '#/components/schemas/Counter'}
        errors: {$ref: '#/components/schemas/Counter'}
        total_ms: {type: number, minimum: 0}
        max_ms: {type: number, minimum: 0}
        buckets:
          type: array
          maxItems: 11
          items:
            type: object
            required: [le_ms, count]
            properties:
              le_ms: {type: number, enum: [1, 5, 10, 25, 50, 100, 250, 500, 1000, 5000, 15000]}
              count: {$ref: '#/components/schemas/Counter'}
    HTTPPerformance:
      type: object
      description: Completed ordinary requests grouped by route template. Database durations aggregate each request's calls. Byte counts exclude HTTP/TLS overhead.
      properties:
        route: {type: string}
        duration: {$ref: '#/components/schemas/DurationMetric'}
        database_query: {$ref: '#/components/schemas/DurationMetric'}
        database_acquire: {$ref: '#/components/schemas/DurationMetric'}
        database_batch: {$ref: '#/components/schemas/DurationMetric'}
        database_lock_query: {$ref: '#/components/schemas/DurationMetric'}
        database_queries: {$ref: '#/components/schemas/Counter'}
        database_acquires: {$ref: '#/components/schemas/Counter'}
        database_batches: {$ref: '#/components/schemas/Counter'}
        response_bytes: {$ref: '#/components/schemas/Counter'}
        uncompressed_bytes: {$ref: '#/components/schemas/Counter'}
        gzip_responses: {$ref: '#/components/schemas/Counter'}
        client_errors: {$ref: '#/components/schemas/Counter'}
        server_errors: {$ref: '#/components/schemas/Counter'}
    ID: {type: string, minLength: 1, maxLength: 128, description: Opaque identifier}
    Token: {type: string, minLength: 32, maxLength: 256, writeOnly: false}
    Quantity:
      type: string
      pattern: '^(0|[1-9][0-9]{0,18})$'
      maxLength: 19
      description: Exact decimal integer in 0..9223372036854775807. No JSON number, sign, decimal point or leading zero.
      examples: ['0', '9007199254740993', '9223372036854775807']
    PositiveQuantity:
      allOf: [{$ref: '#/components/schemas/Quantity'}, {not: {const: '0'}}]
    HealthStatus:
      type: object
      required: [status]
      properties: {status: {type: string, enum: [ok, ready, unavailable]}}
    Member:
      type: object
      required: [id, name, admin]
      properties: {id: {$ref: '#/components/schemas/ID'}, name: {type: string}, admin: {type: boolean}}
    Grant:
      type: object
      additionalProperties: false
      required: [network_id, can_craft]
      properties: {network_id: {$ref: '#/components/schemas/ID'}, can_craft: {type: boolean}}
    Definition:
      type: object
      additionalProperties: false
      required: [kind, name, damage, label, exact]
      properties:
        kind: {type: string, enum: [item, fluid]}
        name: {type: string, minLength: 1, maxLength: 256}
        damage: {type: integer, minimum: 0, maximum: 2147483647}
        nbt: {type: string, maxLength: 16384, description: 'Canonical base64 of one gzip member containing a typed NBT root compound. At most 12288 compressed bytes, 65536 expanded bytes, 32 levels and 1024 tags. Compound order and root name do not affect identity; primitive bits, types and list order do. Omitted for untagged items.'}
        label: {type: string, maxLength: 512}
        exact: {const: true}
    Capabilities:
      type: object
      additionalProperties: false
      properties:
        inventory: {type: boolean}
        quantity_refresh: {type: boolean, description: Supports the independent quantity-only refresh lane. A new boot is required to change negotiated capabilities.}
        craft: {type: boolean}
        cpu_output: {type: boolean}
        exact_quantities: {type: boolean}
        max_craft_quantity: {$ref: '#/components/schemas/Quantity'}
        enumeration: {type: string, maxLength: 64}
    Network:
      type: object
      required: [id, name, server_group, source, revision, capabilities, online, quality, bridge_mode]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        name: {type: string}
        server_group: {type: string}
        source: {type: string, enum: [oc, simulator]}
        session_id: {$ref: '#/components/schemas/ID'}
        revision: {$ref: '#/components/schemas/Quantity'}
        last_seen: {type: string, format: date-time}
        last_inventory: {type: string, format: date-time}
        last_scan: {type: string, format: date-time}
        first_scan: {type: string, format: date-time, description: First scan-completed marker accepted in the current session. Unknown for sessions already scanned before this field was deployed.}
        session_started_at: {type: string, format: date-time, description: Backend creation time of the current bridge session. Not the OC sampling clock.}
        capabilities: {$ref: '#/components/schemas/Capabilities'}
        health: {type: object}
        online: {type: boolean}
        quality: {type: string, enum: [unverified, degraded], description: Never an atomic-snapshot guarantee}
        bridge_mode: {type: string, enum: [single, cooperative]}
        services: {$ref: '#/components/schemas/NetworkServices'}
    NetworkServices:
      type: object
      required: [quantity_readers, discovery, recipes, craft]
      properties:
        quantity_readers: {type: integer, minimum: 0, maximum: 8}
        discovery: {type: boolean}
        recipes: {type: boolean}
        craft: {type: boolean}
        cpu_observed_at: {type: string, format: date-time}
    DeviceView:
      type: object
      additionalProperties: false
      required: [id, network_id, name, role, capabilities, online, revoked]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        network_id: {$ref: '#/components/schemas/ID'}
        name: {type: string}
        role: {type: string, enum: [primary, quantity_worker]}
        session_id: {$ref: '#/components/schemas/ID'}
        capabilities: {$ref: '#/components/schemas/Capabilities'}
        health: {type: object}
        last_seen: {type: string, format: date-time}
        last_inventory: {type: string, format: date-time}
        online: {type: boolean}
        revoked: {type: boolean}
    Item:
      type: object
      required: [id, kind, name, damage, label, exact, quantity, craftable, observed_at, current_session, craftable_current_session]
      properties:
        id: {$ref: '#/components/schemas/PositiveQuantity'}
        canonical_id: {allOf: [{$ref: '#/components/schemas/PositiveQuantity'}], description: 'Present only when an ID lookup used a legacy alias. Stock belongs to this canonical item; aliases must not be added together.'}
        kind: {type: string, enum: [item, fluid]}
        name: {type: string}
        damage: {type: integer}
        label: {type: string}
        exact: {type: boolean}
        quantity: {$ref: '#/components/schemas/Quantity'}
        craftable: {type: boolean}
        observed_at: {type: string, format: date-time, description: Server acceptance time of the latest quantity observation.}
        craftable_observed_at: {type: string, format: date-time, description: Server acceptance time of the latest recipe observation. Omitted when unknown; quantity-only readings do not refresh this time.}
        current_session: {type: boolean, description: Quantity source is still its owning device's current valid session; independent of primary availability and age.}
        craftable_current_session: {type: boolean, description: Recipe source is still its owning device's current valid session.}
    ItemPage:
      type: object
      required: [items, revision]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Item'}}
        revision: {$ref: '#/components/schemas/Quantity'}
        next_cursor: {type: string}
    ItemLookup:
      type: object
      required: [items, missing_ids, revision]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Item'}}
        missing_ids: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/PositiveQuantity'}}
        revision: {$ref: '#/components/schemas/Quantity'}
        refreshes: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/ItemRefresh'}}
    ItemRefresh:
      type: object
      required: [id, request_id, state, requested_at, expires_at]
      properties:
        id: {$ref: '#/components/schemas/PositiveQuantity'}
        request_id: {type: string, pattern: '^[0-9a-f]{32}$'}
        state: {type: string, enum: [pending, confirmed, expired]}
        requested_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        confirmed_at: {type: string, format: date-time, description: Only a successful matching fresh dispatched quantity receipt sets this. Not a recipe or atomic-inventory confirmation.}
    Stack:
      type: object
      additionalProperties: false
      required: [name, label, quantity]
      properties: {name: {type: string, maxLength: 256}, label: {type: string, maxLength: 512}, quantity: {$ref: '#/components/schemas/Quantity'}}
    CPU:
      type: object
      additionalProperties: false
      description: IDs identify entries within this snapshot, not stable hardware across snapshots. Names and array positions are not unique hardware identities either.
      required: [id, name, busy, storage, coprocessors]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        name: {type: string, maxLength: 256}
        busy: {type: boolean}
        storage: {$ref: '#/components/schemas/Quantity'}
        coprocessors: {type: integer, minimum: 0}
        output: {$ref: '#/components/schemas/Stack'}
        output_unavailable: {type: string, maxLength: 256}
    CPUView:
      type: object
      description: Returns the latest accepted snapshot, including its IDs, order and observation time, even when unchanged visible state produced no CPU event.
      required: [session_id, cpus, truncated]
      properties:
        session_id: {type: string}
        cpus: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/CPU'}}
        truncated: {type: boolean}
        observed_at: {type: string, format: date-time}
    OrderState: {type: string, enum: [queued, assigned, computing, running, done, failed, canceled, expired, needs_review]}
    OrderInput:
      type: object
      additionalProperties: false
      required: [item_id, quantity, idempotency_key]
      properties:
        item_id: {$ref: '#/components/schemas/PositiveQuantity'}
        quantity: {$ref: '#/components/schemas/PositiveQuantity'}
        idempotency_key: {type: string, minLength: 8, maxLength: 128}
        ttl_seconds: {type: integer, minimum: 0, maximum: 86400, default: 3600}
    Order:
      type: object
      required: [id, network_id, user_id, item_id, quantity, state, created_at, updated_at, expires_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        network_id: {$ref: '#/components/schemas/ID'}
        user_id: {$ref: '#/components/schemas/ID'}
        item_id: {$ref: '#/components/schemas/PositiveQuantity'}
        quantity: {$ref: '#/components/schemas/PositiveQuantity'}
        state: {$ref: '#/components/schemas/OrderState'}
        attempt_id: {$ref: '#/components/schemas/ID'}
        reason: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    OrderEvent:
      type: object
      required: [id, state, reason, attempt_id, created_at]
      properties:
        id: {$ref: '#/components/schemas/PositiveQuantity'}
        state: {$ref: '#/components/schemas/OrderState'}
        reason: {type: string}
        attempt_id: {type: string}
        created_at: {type: string, format: date-time}
    NetworkEvent:
      type: object
      required: [id, network_id, kind, revision, created_at]
      properties:
        id: {$ref: '#/components/schemas/PositiveQuantity'}
        network_id: {$ref: '#/components/schemas/ID'}
        kind: {type: string, enum: [inventory, orders, cpus, session]}
        revision: {$ref: '#/components/schemas/Quantity'}
        created_at: {type: string, format: date-time}
    Hello:
      type: object
      additionalProperties: false
      required: [protocol, boot_id, source, capabilities, max_response_bytes]
      properties:
        protocol: {const: 1}
        boot_id: {$ref: '#/components/schemas/ID'}
        source: {type: string, enum: [oc, simulator]}
        capabilities: {$ref: '#/components/schemas/Capabilities'}
        max_response_bytes: {type: integer, minimum: 2048, maximum: 131072}
    Limits:
      type: object
      required: [batch_bytes, batch_items, response_bytes, commands, cpus, poll_millis]
      properties:
        batch_bytes: {type: integer}
        batch_items: {type: integer}
        response_bytes: {type: integer}
        commands: {type: integer}
        cpus: {type: integer}
        poll_millis: {type: integer}
        diagnostic_samples:
          type: integer
          minimum: 0
          maximum: 4
          description: Optional read_failures support. Omitted or zero disables the new field on OC.
        sync_telemetry:
          type: boolean
          description: Enables optional sparse health.sync snapshots. Missing or false disables OC timing collection and transmission.
        quantity_refresh:
          type: boolean
          description: Enables refresh capacity and quantity-only receipts on a capable device. Upgrade the backend before the OC bridge.
        read_slots: {type: integer, minimum: 0, maximum: 16}
        read_bytes: {type: integer, minimum: 0, maximum: 16384}
    Welcome:
      type: object
      required: [protocol, network_id, session_id, inventory_ack, poll_ack, limits]
      properties:
        protocol: {const: 1}
        network_id: {$ref: '#/components/schemas/ID'}
        session_id: {$ref: '#/components/schemas/ID'}
        inventory_ack: {$ref: '#/components/schemas/Quantity'}
        poll_ack: {$ref: '#/components/schemas/Quantity'}
        limits: {$ref: '#/components/schemas/Limits'}
    Update:
      type: object
      additionalProperties: false
      required: [quantity, observation, craftable]
      oneOf:
        - {required: [id], not: {required: [item]}}
        - {required: [item], not: {required: [id]}}
      properties:
        id: {$ref: '#/components/schemas/PositiveQuantity'}
        item: {$ref: '#/components/schemas/Definition'}
        quantity: {$ref: '#/components/schemas/Quantity'}
        observation: {$ref: '#/components/schemas/PositiveQuantity'}
        craftable:
          type: [boolean, 'null']
          description: Null observes quantity only and preserves the current session's last confirmed recipe flag.
        verification:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: Echo a priority verification token only after reading the exact item and its recipe after that request. A fresh observation with a boolean craftable flag confirms it.
        refresh:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: Independent quantity-only receipt. Only a fresh matching generation dispatched in this session before expiry confirms it; it never satisfies recipe-required order verification.
    InventoryBatch:
      type: object
      additionalProperties: false
      required: [session_id, sequence, updates]
      properties:
        session_id: {$ref: '#/components/schemas/ID'}
        sequence: {$ref: '#/components/schemas/PositiveQuantity'}
        updates: {type: array, maxItems: 512, items: {$ref: '#/components/schemas/Update'}}
        scan_completed: {type: boolean}
    InventoryAck:
      type: object
      required: [ack, revision, bindings]
      properties:
        ack: {$ref: '#/components/schemas/PositiveQuantity'}
        revision: {$ref: '#/components/schemas/Quantity'}
        bindings:
          type: array
          maxItems: 512
          items:
            type: object
            required: [index, id]
            properties: {index: {type: integer, minimum: 1}, id: {$ref: '#/components/schemas/PositiveQuantity'}}
    Report:
      type: object
      additionalProperties: false
      required: [order_id, attempt_id, state]
      properties:
        order_id: {$ref: '#/components/schemas/ID'}
        attempt_id: {$ref: '#/components/schemas/ID'}
        state: {type: string, enum: [computing, running, done, failed, canceled, needs_review]}
        reason: {type: string, maxLength: 1024}
    DeviceHealth:
      type: object
      additionalProperties: false
      required: [free_memory, diagnostics]
      properties:
        free_memory: {$ref: '#/components/schemas/Quantity'}
        inventory: {$ref: '#/components/schemas/InventoryTelemetry'}
        sync: {$ref: '#/components/schemas/SyncTelemetry'}
        read_failures:
          type: array
          maxItems: 4
          description: A bounded replacement snapshot; omit to retain the previous snapshot in this session, send [] to clear. Normalized JSON is limited to 2048 bytes.
          items: {$ref: '#/components/schemas/ReadFailure'}
        diagnostics:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [code, count]
            properties: {code: {type: string, minLength: 1, maxLength: 64}, count: {$ref: '#/components/schemas/Quantity'}}
    ReadFailure:
      type: object
      additionalProperties: false
      description: A lossy diagnostic hint, never an inventory identity or evidence of zero stock. OC retains no full NBT or original exception object.
      required: [code, source, name, damage, nbt_bytes, message, occurrences, last_seen_millis]
      properties:
        code: {type: string, enum: [exact_lookup_failed, recipe_lookup_failed]}
        source: {type: string, enum: [event, recheck, priority, refresh]}
        item_id: {$ref: '#/components/schemas/PositiveQuantity'}
        name: {type: string, minLength: 1, maxLength: 256, description: At most 256 UTF-8 bytes after sanitizing and truncation.}
        damage: {type: integer, minimum: 0, maximum: 2147483647}
        nbt_bytes: {type: integer, minimum: 0, maximum: 16384, description: Length of the NBT prefix used for diagnostics; capped at 16384 bytes.}
        nbt_adler32: {type: string, pattern: '^[0-9a-f]{8}$', description: Optional Adler-32 of that prefix; collisions are possible and it must not identify inventory.}
        message: {type: string, minLength: 1, maxLength: 160, description: At most 160 UTF-8 bytes. OC replaces invalid UTF-8 and control characters; non-string errors expose only their type. Cooperative messages prefix quantity/recipe/candidate processing stages; they do not necessarily identify native-call failures.}
        occurrences: {$ref: '#/components/schemas/PositiveQuantity'}
        last_seen_millis: {$ref: '#/components/schemas/Quantity'}
        truncated: {type: boolean, description: A text field or NBT prefix was sanitized or shortened, or an exception object was reduced to its type.}
    InventoryTelemetry:
      type: object
      additionalProperties: false
      description: Per-boot acknowledged inventory payloads and collection work; not unique items or retransmitted wire bytes. OC counters saturate at 9007199254740991.
      required: [batches, updates, bytes, credits_used, collect_millis]
      properties:
        batches: {$ref: '#/components/schemas/Quantity'}
        updates: {$ref: '#/components/schemas/Quantity'}
        bytes: {$ref: '#/components/schemas/Quantity'}
        credits_used: {$ref: '#/components/schemas/Quantity'}
        collect_millis: {$ref: '#/components/schemas/Quantity'}
    SyncTelemetry:
      type: object
      additionalProperties: false
      required: [captured_millis, stages]
      description: Fixed-size cumulative timing on the OC monotonic clock. Omit to retain this session's last snapshot. New sessions clear it. OC sends at most once per 30 seconds after successful confirmation, subject to memory and request space.
      properties:
        captured_millis: {$ref: '#/components/schemas/Quantity'}
        first_scan_ack_millis:
          allOf: [{$ref: '#/components/schemas/Quantity'}]
          description: Milliseconds from runner.start, including handshake, until the first completed-scan batch has a valid ACK. Must not exceed captured_millis.
        stages:
          type: object
          additionalProperties: false
          properties:
            event_queue: {$ref: '#/components/schemas/LatencyHistogram'}
            recheck_queue: {$ref: '#/components/schemas/LatencyHistogram'}
            priority_queue: {$ref: '#/components/schemas/LatencyHistogram'}
            collection: {$ref: '#/components/schemas/LatencyHistogram'}
            inventory_http: {$ref: '#/components/schemas/LatencyHistogram'}
            control_http: {$ref: '#/components/schemas/LatencyHistogram'}
            batch_ack: {$ref: '#/components/schemas/LatencyHistogram'}
            scan: {$ref: '#/components/schemas/LatencyHistogram'}
    LatencyHistogram:
      type: object
      additionalProperties: false
      required: [samples, errors, total_millis, max_millis, buckets]
      description: Disjoint bucket counts sum to samples. Missing phase means no sample. Errors cannot exceed samples; max_millis cannot exceed total_millis. OC counters saturate within the exact Lua 5.2 integer range.
      properties:
        samples: {$ref: '#/components/schemas/PositiveQuantity'}
        errors: {$ref: '#/components/schemas/Quantity'}
        total_millis: {$ref: '#/components/schemas/Quantity'}
        max_millis: {$ref: '#/components/schemas/Quantity'}
        buckets:
          type: array
          minItems: 8
          maxItems: 8
          description: Disjoint upper bounds in milliseconds are 10, 50, 100, 250, 1000, 5000, 30000 and infinity. Quantiles are bucket ranges, not exact durations.
          items: {$ref: '#/components/schemas/Quantity'}
    Poll:
      type: object
      additionalProperties: false
      required: [session_id, sequence, reports]
      properties:
        session_id: {$ref: '#/components/schemas/ID'}
        sequence: {$ref: '#/components/schemas/PositiveQuantity'}
        reports: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/Report'}}
        cpus: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/CPU'}}
        cpus_truncated: {type: boolean}
        health: {$ref: '#/components/schemas/DeviceHealth'}
        recheck_slots: {type: integer, minimum: 0, maximum: 16, description: Available ordinary verification slots; zero leaves ordinary work due. Priority verification uses a separate queue.}
        recheck_bytes: {type: integer, minimum: 0, maximum: 16384, description: Available estimated ordinary verification queue bytes; omit for legacy behavior.}
        refresh_slots: {type: integer, minimum: 0, maximum: 8, description: Available slots in the separate quantity refresh queue. Both refresh capacity fields must be present and positive for dispatch.}
        refresh_bytes: {type: integer, minimum: 0, maximum: 16384, description: Available estimated bytes in the separate quantity refresh queue.}
    Command:
      type: object
      required: [order_id, attempt_id, item_id, item, quantity, current_quantity]
      properties:
        order_id: {$ref: '#/components/schemas/ID'}
        attempt_id: {$ref: '#/components/schemas/ID'}
        item_id: {$ref: '#/components/schemas/PositiveQuantity'}
        item: {$ref: '#/components/schemas/Definition'}
        quantity: {$ref: '#/components/schemas/PositiveQuantity'}
        current_quantity: {$ref: '#/components/schemas/Quantity'}
    Verification:
      type: object
      required: [id, item, craftable]
      properties:
        id: {$ref: '#/components/schemas/PositiveQuantity'}
        item: {$ref: '#/components/schemas/Definition'}
        craftable: {type: boolean}
        token:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: Present for a durable priority read. Keep it separate from evictable inventory events; echo it in a fresh verified Update. Sending the request does not complete it.
    PollAck:
      type: object
      required: [ack, commands, verify, poll_millis, scan_budget]
      properties:
        ack: {$ref: '#/components/schemas/PositiveQuantity'}
        commands: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/Command'}}
        verify: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/Verification'}}
        poll_millis: {type: integer, minimum: 1, maximum: 30000}
        scan_budget: {type: integer, minimum: 0, maximum: 512}
        refresh: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/QuantityRefresh'}}
    QuantityRefresh:
      type: object
      required: [id, item, token, ttl_millis]
      properties:
        id: {$ref: '#/components/schemas/PositiveQuantity'}
        item: {$ref: '#/components/schemas/Definition'}
        token: {type: string, pattern: '^[0-9a-f]{32}$'}
        ttl_millis: {type: integer, minimum: 1, maximum: 60000, description: Remaining backend lifetime at dispatch. OC expires local work on its monotonic clock; retries of the same generation cannot extend that deadline.}
    HelloV2:
      type: object
      additionalProperties: false
      required: [protocol, boot_id, source, capabilities, max_response_bytes]
      properties:
        protocol: {const: 2}
        boot_id: {$ref: '#/components/schemas/ID'}
        source: {type: string, enum: [oc, simulator]}
        capabilities: {$ref: '#/components/schemas/Capabilities'}
        max_response_bytes: {type: integer, minimum: 2048, maximum: 131072}
    WelcomeV2:
      type: object
      required: [protocol, network_id, device_id, role, session_id, inventory_ack, poll_ack, limits]
      properties:
        protocol: {const: 2}
        network_id: {$ref: '#/components/schemas/ID'}
        device_id: {$ref: '#/components/schemas/ID'}
        role: {type: string, enum: [primary, quantity_worker]}
        session_id: {$ref: '#/components/schemas/ID'}
        inventory_ack: {$ref: '#/components/schemas/Quantity'}
        poll_ack: {$ref: '#/components/schemas/Quantity'}
        limits: {$ref: '#/components/schemas/Limits'}
    AssignmentID: {type: string, pattern: '^[0-9a-f]{32}$'}
    ReadHint:
      type: object
      additionalProperties: false
      oneOf:
        - {required: [id], not: {required: [item]}}
        - {required: [item], not: {required: [id]}}
      properties:
        id: {$ref: '#/components/schemas/PositiveQuantity'}
        item: {$ref: '#/components/schemas/Definition'}
    ReadAssignment:
      type: object
      additionalProperties: false
      required: [id, item, assignment_id, kind, purpose, ttl_millis]
      properties:
        id: {$ref: '#/components/schemas/PositiveQuantity'}
        item: {$ref: '#/components/schemas/Definition'}
        assignment_id: {$ref: '#/components/schemas/AssignmentID'}
        kind: {type: string, enum: [quantity, quantity_recipe]}
        purpose: {type: string, enum: [refresh, order, background]}
        ttl_millis: {type: integer, minimum: 1, maximum: 30000}
    UpdateV2:
      type: object
      additionalProperties: false
      required: [quantity, observation, craftable]
      oneOf:
        - {required: [id], not: {required: [item]}}
        - {required: [item], not: {required: [id]}}
      properties:
        id: {$ref: '#/components/schemas/PositiveQuantity'}
        item: {$ref: '#/components/schemas/Definition'}
        quantity: {$ref: '#/components/schemas/Quantity'}
        observation: {$ref: '#/components/schemas/PositiveQuantity'}
        craftable: {type: [boolean, 'null']}
        assignment_id: {$ref: '#/components/schemas/AssignmentID'}
    InventoryBatchV2:
      type: object
      additionalProperties: false
      required: [session_id, sequence, updates]
      properties:
        session_id: {$ref: '#/components/schemas/ID'}
        sequence: {$ref: '#/components/schemas/PositiveQuantity'}
        updates: {type: array, maxItems: 512, items: {$ref: '#/components/schemas/UpdateV2'}}
        scan_completed: {type: boolean}
    PollV2:
      type: object
      additionalProperties: false
      required: [session_id, sequence]
      properties:
        session_id: {$ref: '#/components/schemas/ID'}
        sequence: {$ref: '#/components/schemas/PositiveQuantity'}
        reports: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/Report'}}
        cpus: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/CPU'}}
        cpus_truncated: {type: boolean}
        health: {$ref: '#/components/schemas/DeviceHealth'}
        read_slots: {type: integer, minimum: 0, maximum: 16}
        read_bytes: {type: integer, minimum: 0, maximum: 16384}
        hints: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/ReadHint'}}
    PollAckV2:
      type: object
      additionalProperties: false
      required: [ack, commands, reads, poll_millis, scan_budget]
      properties:
        ack: {$ref: '#/components/schemas/PositiveQuantity'}
        commands: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/Command'}}
        poll_millis: {type: integer, minimum: 1, maximum: 30000}
        scan_budget: {type: integer, minimum: 0, maximum: 32}
        reads: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/ReadAssignment'}}
        grant_id: {$ref: '#/components/schemas/AssignmentID'}
        grant_ttl_millis: {type: integer, minimum: 1, maximum: 30000}
